<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="La pagina web exportada: un solo archivo HTML con dibujos, croquis 3D y notas, una barra unica, y que se puede anotar y volver a guardar sin conexion">
  <g font-family="sans-serif" fill="#8B8B9E">
    <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#6965DB">
      un archivo .html: se abre en cualquier móvil, sin instalar nada
    </text>

    <!-- las tres clases de página -->
    <g transform="translate(26,40)">
      <rect x="0" y="0" width="152" height="128" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <rect x="14" y="14" width="124" height="76" rx="3" fill="#8B8B9E" opacity="0.08"/>
      <path d="M28 74 l24 -30 l22 14 l30 -34" fill="none" stroke="#6965DB" stroke-width="2.4"/>
      <rect x="34" y="30" width="40" height="26" fill="none" stroke="#6965DB" stroke-width="1.6"/>
      <text x="76" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">dibujo o plano</text>
      <text x="76" y="124" text-anchor="middle" font-size="8.5">SVG · el PDF va como líneas</text>
    </g>

    <g transform="translate(196,40)">
      <rect x="0" y="0" width="152" height="128" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <rect x="14" y="14" width="124" height="76" rx="3" fill="#101B24" opacity="0.1"/>
      <g stroke="#8B8B9E" stroke-width="0.8" opacity="0.55">
        <path d="M22 80 l30 -12 M50 84 l30 -12 M78 88 l30 -12 M30 68 l30 12 M58 64 l30 12 M86 60 l30 12"/>
      </g>
      <path d="M40 66 l22 -22 l24 10 l22 -16" fill="none" stroke="#6965DB" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="70" cy="82" rx="30" ry="5" fill="#101B24" opacity="0.2"/>
      <text x="76" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">croquis 3D</text>
      <text x="76" y="124" text-anchor="middle" font-size="8.5">se gira con el dedo, con WebGL</text>
    </g>

    <g transform="translate(366,40)">
      <rect x="0" y="0" width="152" height="128" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <g fill="#8B8B9E" opacity="0.35">
        <rect x="20" y="20" width="70" height="7" rx="3.5"/>
        <rect x="20" y="36" width="112" height="5" rx="2.5"/><rect x="20" y="48" width="112" height="5" rx="2.5"/>
        <rect x="20" y="60" width="86" height="5" rx="2.5"/>
      </g>
      <rect x="20" y="72" width="112" height="16" rx="8" fill="#2F9E44" opacity="0.35"/>
      <path d="M30 80 l6 -4 v8 z" fill="#2F9E44"/>
      <text x="76" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">nota</text>
      <text x="76" y="124" text-anchor="middle" font-size="8.5">texto de verdad: se busca y copia</text>
    </g>

    <!-- lo que trae -->
    <g transform="translate(538,40)">
      <rect x="0" y="0" width="258" height="128" rx="8" fill="#6965DB" opacity="0.08"/>
      <rect x="0" y="0" width="258" height="128" rx="8" fill="none" stroke="#6965DB" stroke-width="1.3"/>
      <text x="16" y="22" font-size="11.5" font-weight="bold" fill="#6965DB">y quien la reciba puede</text>
      <g font-size="10">
        <text x="16" y="42">✎ rayar encima con lápiz y resaltador</text>
        <text x="16" y="60">↔ medir en metros, si calibraste la escala</text>
        <text x="16" y="78">◍ apagar capas del plano o grupos del croquis</text>
        <text x="16" y="96">⤓ guardar: la página se reescribe a sí misma</text>
      </g>
      <text x="16" y="118" font-size="9" opacity="0.85">con lo que rayó dentro: sigue siendo un archivo</text>
    </g>

    <!-- la barra -->
    <g transform="translate(26,182)">
      <rect x="0" y="0" width="492" height="56" rx="12" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
      <text x="14" y="20" font-size="11" font-weight="bold" fill="#6965DB">una sola barra para las tres</text>
      <g transform="translate(14,28)" fill="#6965DB" opacity="0.3">
        <rect x="0" y="0" width="20" height="20" rx="5"/><rect x="24" y="0" width="20" height="20" rx="5"/>
        <rect x="48" y="0" width="20" height="20" rx="5"/>
        <rect x="80" y="0" width="20" height="20" rx="5"/><rect x="104" y="0" width="20" height="20" rx="5"/>
        <rect x="136" y="0" width="20" height="20" rx="5"/><rect x="160" y="0" width="20" height="20" rx="5"/>
        <rect x="184" y="0" width="20" height="20" rx="5"/>
      </g>
      <text x="230" y="42" font-size="9.5">los que no valen en esa página se esconden solos</text>
    </g>

    <!-- el visor 3D -->
    <g transform="translate(538,182)">
      <rect x="0" y="0" width="258" height="56" rx="12" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
      <text x="14" y="20" font-size="11" font-weight="bold" fill="#6965DB">en el croquis, además</text>
      <text x="14" y="36" font-size="9.5">suelo con rejilla, sombra, niebla, giradiscos,</text>
      <text x="14" y="48" font-size="9.5">guía de gestos y bajar el OBJ desde la página</text>
    </g>

    <!-- de dónde sale -->
    <g transform="translate(26,254)">
      <rect x="0" y="0" width="770" height="46" rx="10" fill="none" stroke="#2F9E44" stroke-width="1.3"/>
      <text x="16" y="20" font-size="11" font-weight="bold" fill="#2F9E44">de dónde sale</text>
      <text x="16" y="36" font-size="10">de un dibujo suelto, de un croquis, o marcando páginas de varios proyectos a la vez: todas caben en el mismo documento.</text>
    </g>

    <text x="410" y="320" text-anchor="middle" font-size="11">
      todo va dentro: fuentes, fotos y audios en base64. No pide nada a ningún servidor, así que funciona sin conexión y no caduca
    </text>
  </g>
</svg>
