<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Anatomia de un elemento: una ficha plana con sitio, forma, trazo, semilla y extras">
  <g font-family="sans-serif" fill="#8B8B9E">
    <text x="400" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#6965DB">
      todo lo que dibujas es una ficha así
    </text>

    <!-- la ficha -->
    <g transform="translate(40,42)">
      <rect x="0" y="0" width="330" height="322" rx="8" fill="none" stroke="#6965DB" stroke-width="1.8"/>

      <rect x="0" y="0" width="330" height="30" rx="8" fill="#6965DB" opacity="0.16"/>
      <text x="14" y="20" font-size="12" fill="#6965DB" font-weight="bold">elemento</text>
      <text x="316" y="20" font-size="11" text-anchor="end">1 fila · sin herencias</text>

      <g font-size="11.5">
        <g fill="#8B8B9E">
          <text x="14" y="54">id</text>
          <text x="14" y="76">tipo</text>
          <text x="14" y="98">x · y · ancho · alto</text>
          <text x="14" y="120">ángulo</text>
          <text x="14" y="142">color · relleno · estilo</text>
          <text x="14" y="164">grosor · dureza · opacidad</text>
          <text x="14" y="186">semilla</text>
          <text x="14" y="208">puntos</text>
          <text x="14" y="230">huecos</text>
          <text x="14" y="252">arco: inicio · barrido</text>
          <text x="14" y="274">texto · fuente · tamaño</text>
          <text x="14" y="296">grupo · capa · referencia</text>
        </g>
        <g fill="#101B24" font-size="10.5" text-anchor="end">
          <text x="316" y="54" fill="#8B8B9E">quién es</text>
          <text x="316" y="76" fill="#6965DB">rect · elipse · rombo · línea · flecha · lápiz</text>
          <text x="316" y="98" fill="#8B8B9E">dónde y cuánto ocupa</text>
          <text x="316" y="120" fill="#8B8B9E">girado sobre su centro</text>
          <text x="316" y="142" fill="#8B8B9E">cómo se ve</text>
          <text x="316" y="164" fill="#8B8B9E">cómo se ve</text>
          <text x="316" y="186" fill="#E03131">el temblor exacto de su trazo</text>
          <text x="316" y="208" fill="#8B8B9E">solo líneas y lápiz</text>
          <text x="316" y="230" fill="#8B8B9E">solo relleno de bote</text>
          <text x="316" y="252" fill="#8B8B9E">solo semicírculos</text>
          <text x="316" y="274" fill="#8B8B9E">solo texto</text>
          <text x="316" y="296" fill="#8B8B9E">dibujo o guía</text>
        </g>
      </g>
    </g>

    <!-- semilla -->
    <g transform="translate(420,52)">
      <text x="0" y="0" font-size="12" fill="#E03131" font-weight="bold">la semilla</text>
      <rect x="0" y="26" width="160" height="70" fill="none" stroke="#8B8B9E"
            stroke-width="0.8" stroke-dasharray="4 4" opacity="0.7"/>
      <path d="M-2 30 q80 -8 163 4 q4 32 -2 62 q-80 8 -160 -2 q-4 -30 1 -64z
               M-2 30 q78 -6 161 3" fill="none" stroke="#6965DB" stroke-width="2.2"/>
      <text x="80" y="116" text-anchor="middle" font-size="11">semilla 481</text>

      <rect x="0" y="146" width="160" height="70" fill="none" stroke="#8B8B9E"
            stroke-width="0.8" stroke-dasharray="4 4" opacity="0.7"/>
      <path d="M3 143 q76 10 155 -2 q-4 34 3 68 q-82 -8 -159 3 q6 -32 0 -66z
               M3 143 q80 8 152 0" fill="none" stroke="#6965DB" stroke-width="2.2"/>
      <text x="80" y="236" text-anchor="middle" font-size="11">semilla 902</text>

      <text x="80" y="266" text-anchor="middle" font-size="11">misma caja, otro garabato</text>
      <text x="80" y="288" text-anchor="middle" font-size="11" fill="#E03131">
        se guarda: no baila al redibujar
      </text>
    </g>

    <text x="400" y="388" text-anchor="middle" font-size="11">
      es el mismo formato de un archivo .excalidraw: lo que dibujas aquí se abre allí y al revés
    </text>
  </g>
</svg>
