<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="El croquis en el espacio: los trazos se quedan fijos al mundo, la camara gira alrededor de lo dibujado, hay cuerpos y sol, y el modo en el sitio usa la camara del telefono">
  <g font-family="sans-serif" fill="#8B8B9E">
    <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#6965DB">
      dibujar en el espacio, no sobre un papel
    </text>

    <!-- 1 el trazo se queda en el mundo -->
    <g transform="translate(24,42)">
      <rect x="0" y="0" width="176" height="196" rx="10" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <text x="88" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">el trazo es del mundo</text>
      <!-- vista A -->
      <g transform="translate(14,30)">
        <path d="M4 58 l30 -34 l40 12 l32 -26" fill="none" stroke="#6965DB" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
        <path d="M4 58 l30 -34 l40 12 l32 -26" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
        <text x="74" y="76" text-anchor="middle" font-size="9">desde aquí</text>
      </g>
      <!-- vista B, girada -->
      <g transform="translate(14,100)">
        <path d="M6 40 l24 12 l44 -22 l32 20" fill="none" stroke="#6965DB" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
        <path d="M6 40 l24 12 l44 -22 l32 20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <text x="74" y="68" text-anchor="middle" font-size="9">y desde aquí</text>
      </g>
      <text x="88" y="186" text-anchor="middle" font-size="9" opacity="0.85">se afila en las puntas y engorda</text>
    </g>

    <!-- 2 girar alrededor -->
    <g transform="translate(214,42)">
      <rect x="0" y="0" width="176" height="196" rx="10" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <text x="88" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">se gira alrededor de él</text>
      <ellipse cx="88" cy="104" rx="66" ry="26" fill="none" stroke="#8B8B9E" stroke-width="1.2" stroke-dasharray="4 4"/>
      <g stroke="#6965DB" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M66 118 l16 -30 l22 10 l14 -22"/>
      </g>
      <circle cx="88" cy="104" r="3.5" fill="#E03131"/>
      <g fill="#6965DB">
        <circle cx="154" cy="104" r="7" opacity="0.3"/><circle cx="154" cy="104" r="3"/>
      </g>
      <path d="M138 128 a58 30 0 0 0 26 -40" fill="none" stroke="#6965DB" stroke-width="1.4" marker-end="url(#p)"/>
      <text x="88" y="158" text-anchor="middle" font-size="9.5">el eje es el centro de lo que ves,</text>
      <text x="88" y="171" text-anchor="middle" font-size="9.5">no un punto cualquiera: así no</text>
      <text x="88" y="184" text-anchor="middle" font-size="9.5">se te escapa de la pantalla</text>
    </g>

    <!-- 3 cuerpos, sol y grupos -->
    <g transform="translate(404,42)">
      <rect x="0" y="0" width="176" height="196" rx="10" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <text x="88" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">cuerpos, sol y grupos</text>
      <circle cx="46" cy="66" r="22" fill="#1971C2" opacity="0.75"/>
      <path d="M30 52 a22 22 0 0 1 24 -6" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
      <path d="M94 46 h40 v42 h-40 z" fill="#2F9E44" opacity="0.55"/>
      <path d="M94 46 l14 -12 h40 l-14 12 z" fill="#2F9E44" opacity="0.8"/>
      <path d="M134 46 l14 -12 v42 l-14 12 z" fill="#2F9E44" opacity="0.35"/>
      <g stroke="#F08C00" stroke-width="1.6"><circle cx="150" cy="112" r="7" fill="#F08C00" opacity="0.5"/>
        <path d="M150 100 v-6 M162 112 h6 M158 104 l4 -4 M158 120 l4 4 M142 104 l-4 -4"/></g>
      <ellipse cx="46" cy="98" rx="24" ry="6" fill="#101B24" opacity="0.18"/>
      <ellipse cx="116" cy="100" rx="26" ry="6" fill="#101B24" opacity="0.18"/>
      <g font-size="9.5">
        <text x="88" y="140" text-anchor="middle">bola, cilindro, cono y anillo;</text>
        <text x="88" y="153" text-anchor="middle">licuar para deformar a mano</text>
        <text x="88" y="171" text-anchor="middle">cada trazo en su grupo:</text>
        <text x="88" y="184" text-anchor="middle">se apagan y se encienden</text>
      </g>
    </g>

    <!-- 4 en el sitio -->
    <g transform="translate(594,42)">
      <rect x="0" y="0" width="202" height="196" rx="10" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <text x="101" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">◉ en el sitio</text>
      <rect x="52" y="32" width="98" height="86" rx="6" fill="#101B24" opacity="0.14"/>
      <g opacity="0.5" stroke="#8B8B9E" stroke-width="1.2" fill="none">
        <path d="M60 108 v-28 h20 v28 M96 108 v-44 h22 v44 M126 108 v-20 h18 v20"/>
      </g>
      <path d="M66 96 l22 -22 l26 10 l24 -18" fill="none" stroke="#E03131" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(14,44)" opacity="0.9">
        <rect x="0" y="0" width="26" height="44" rx="5" fill="none" stroke="#6965DB" stroke-width="1.6"/>
        <circle cx="13" cy="10" r="3" fill="#6965DB"/>
      </g>
      <path d="M42 66 h8" stroke="#6965DB" stroke-width="1.4" marker-end="url(#p)"/>
      <g font-size="9.5">
        <text x="101" y="140" text-anchor="middle">la cámara de atrás de fondo y el</text>
        <text x="101" y="153" text-anchor="middle">croquis encima, a tamaño real</text>
        <text x="101" y="171" text-anchor="middle">mueves el teléfono y la vista se</text>
        <text x="101" y="184" text-anchor="middle">mueve: mides andando por la obra</text>
      </g>
    </g>

    <text x="410" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#6965DB">y sale de aquí como</text>
    <g transform="translate(150,278)" font-size="10.5">
      <g><rect x="0" y="0" width="150" height="34" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.1"/>
        <text x="75" y="14" text-anchor="middle" font-weight="bold" fill="#8B8B9E">página web</text>
        <text x="75" y="27" text-anchor="middle" font-size="8.5">se gira en cualquier navegador</text></g>
      <g transform="translate(170,0)"><rect x="0" y="0" width="150" height="34" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.1"/>
        <text x="75" y="14" text-anchor="middle" font-weight="bold" fill="#8B8B9E">OBJ + MTL</text>
        <text x="75" y="27" text-anchor="middle" font-size="8.5">tubos de 8 lados, para Blender</text></g>
      <g transform="translate(340,0)"><rect x="0" y="0" width="150" height="34" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.1"/>
        <text x="75" y="14" text-anchor="middle" font-weight="bold" fill="#8B8B9E">láminas del proyecto</text>
        <text x="75" y="27" text-anchor="middle" font-size="8.5">cada vista congelada, una hoja</text></g>
    </g>

    <defs>
      <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#6965DB"/>
      </marker>
    </defs>
  </g>
</svg>
