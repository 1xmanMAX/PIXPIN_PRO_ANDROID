<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Cómo funciona: apuntas, se guarda en el chat, se ordena en proyectos y lo compartes">
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8B8B9E"/></marker></defs>
    <!-- 4 pasos -->
    <g transform="translate(14,20)">
      <rect width="190" height="200" rx="18" fill="#6965DB" fill-opacity="0.1" stroke="#6965DB" stroke-width="1.6"/>
      <circle cx="30" cy="30" r="16" fill="#6965DB"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
      <text x="56" y="36" font-size="17" font-weight="700" fill="#6965DB">Apunta</text>
      <g fill="none" stroke="#6965DB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-12)">
        <!-- lápiz -->
        <path d="M42 112 l34 -34 l10 10 l-34 34 l-14 4 z"/><path d="M70 84 l10 10"/>
        <!-- cámara -->
        <rect x="104" y="80" width="54" height="38" rx="7"/><circle cx="131" cy="99" r="10"/><path d="M118 80 l5 -7 h16 l5 7"/>
        <!-- micrófono -->
        <rect x="52" y="128" width="18" height="28" rx="9"/><path d="M44 146 a17 17 0 0 0 34 0"/><path d="M61 163 v7"/>
        <!-- documento -->
        <path d="M112 126 h26 l12 12 v34 h-38 z"/><path d="M138 126 v12 h12"/><path d="M119 150 h22 M119 160 h22"/>
      </g>
      <text x="95" y="182" text-anchor="middle" font-size="12" fill="#8B8B9E">lápiz, foto, voz, PDF</text>
    </g>
    <g transform="translate(240,20)">
      <rect width="190" height="200" rx="18" fill="#1971C2" fill-opacity="0.1" stroke="#1971C2" stroke-width="1.6"/>
      <circle cx="30" cy="30" r="16" fill="#1971C2"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
      <text x="56" y="36" font-size="17" font-weight="700" fill="#1971C2">Se guarda</text>
      <rect x="24" y="60" width="110" height="26" rx="12" fill="#1971C2" fill-opacity="0.25"/>
      <rect x="56" y="94" width="110" height="26" rx="12" fill="#1971C2" fill-opacity="0.45"/>
      <rect x="24" y="128" width="110" height="26" rx="12" fill="#1971C2" fill-opacity="0.25"/>
      <text x="95" y="182" text-anchor="middle" font-size="12" fill="#8B8B9E">en un chat contigo mismo</text>
    </g>
    <g transform="translate(466,20)">
      <rect width="190" height="200" rx="18" fill="#2F9E44" fill-opacity="0.1" stroke="#2F9E44" stroke-width="1.6"/>
      <circle cx="30" cy="30" r="16" fill="#2F9E44"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
      <text x="56" y="36" font-size="17" font-weight="700" fill="#2F9E44">Se ordena</text>
      <g fill="#2F9E44"><rect x="28" y="62" width="60" height="44" rx="6" fill-opacity="0.35"/><rect x="100" y="62" width="60" height="44" rx="6" fill-opacity="0.2"/><rect x="28" y="114" width="60" height="44" rx="6" fill-opacity="0.2"/><rect x="100" y="114" width="60" height="44" rx="6" fill-opacity="0.35"/></g>
      <text x="95" y="182" text-anchor="middle" font-size="12" fill="#8B8B9E">en proyectos con sus hojas</text>
    </g>
    <g transform="translate(692,20)">
      <rect width="194" height="200" rx="18" fill="#F08C00" fill-opacity="0.1" stroke="#F08C00" stroke-width="1.6"/>
      <circle cx="30" cy="30" r="16" fill="#F08C00"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
      <text x="56" y="36" font-size="17" font-weight="700" fill="#F08C00">Compártelo</text>
      <g font-size="13" font-weight="600" fill="#F08C00">
        <rect x="24" y="58" width="146" height="28" rx="14" fill="#F08C00" fill-opacity="0.18"/><text x="97" y="77" text-anchor="middle">Página web</text>
        <rect x="24" y="94" width="146" height="28" rx="14" fill="#F08C00" fill-opacity="0.18"/><text x="97" y="113" text-anchor="middle">PDF · Word</text>
        <rect x="24" y="130" width="146" height="28" rx="14" fill="#F08C00" fill-opacity="0.18"/><text x="97" y="149" text-anchor="middle">Tu PC, por Wi-Fi</text>
      </g>
      <text x="97" y="182" text-anchor="middle" font-size="12" fill="#8B8B9E">sin que nadie instale nada</text>
    </g>
    <g stroke="#8B8B9E" stroke-width="2" marker-end="url(#m)"><path d="M206 120 h30"/><path d="M432 120 h30"/><path d="M658 120 h30"/></g>
  </g>
</svg>
