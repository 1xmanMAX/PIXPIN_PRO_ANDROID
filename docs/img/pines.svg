<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Tipos de pin flotante: imagen, nota, tabla, PDF, grupos y mini apps">
  <g font-family="sans-serif" fill="#8B8B9E">
    <g font-size="13" font-weight="bold" fill="#6965DB" text-anchor="middle">
      <text x="120" y="24">imagen</text>
      <text x="400" y="24">nota</text>
      <text x="680" y="24">tabla</text>
      <text x="120" y="200">PDF</text>
      <text x="400" y="200">grupos</text>
      <text x="680" y="200">mini apps</text>
    </g>

    <!-- imagen -->
    <rect x="50" y="40" width="140" height="104" rx="8" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.6"/>
    <rect x="50" y="40" width="140" height="16" rx="8" fill="#6965DB" opacity="0.25"/>
    <path d="M50 132 l38 -36 l30 24 l22 -18 l50 40z" fill="#8B8B9E" opacity="0.35"/>
    <circle cx="80" cy="74" r="8" fill="#F08C00" opacity="0.6"/>
    <g stroke="#8B8B9E" stroke-width="1.2"><path d="M170 128 l14 14"/></g>
    <g font-size="11" text-anchor="middle">
      <text x="120" y="166">zoom, recorte y opacidad</text>
      <text x="120" y="182">sigue encima aunque cambies de app</text>
    </g>

    <!-- nota -->
    <rect x="330" y="40" width="140" height="104" rx="8" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.6"/>
    <rect x="330" y="40" width="140" height="16" rx="8" fill="#6965DB" opacity="0.25"/>
    <g font-size="12" fill="#101B24"><text x="344" y="80" font-weight="bold"># Obra</text></g>
    <g fill="#8B8B9E" opacity="0.6"><rect x="344" y="90" width="90" height="5" rx="2"/>
      <rect x="344" y="102" width="112" height="5" rx="2"/></g>
    <g fill="#6965DB"><circle cx="348" cy="120" r="3"/><circle cx="348" cy="132" r="3"/></g>
    <g fill="#8B8B9E" opacity="0.6"><rect x="358" y="118" width="70" height="5" rx="2"/>
      <rect x="358" y="130" width="86" height="5" rx="2"/></g>
    <g font-size="11" text-anchor="middle"><text x="400" y="166">markdown: títulos, listas, casillas</text></g>

    <!-- tabla -->
    <g transform="translate(610,40)">
      <rect x="0" y="0" width="140" height="104" rx="8" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.6"/>
      <rect x="0" y="0" width="140" height="16" rx="8" fill="#6965DB" opacity="0.25"/>
      <g stroke="#8B8B9E" stroke-width="0.9" opacity="0.7">
        <path d="M0 40 h140 M0 62 h140 M0 84 h140 M46 24 v80 M93 24 v80"/>
      </g>
      <rect x="0" y="24" width="140" height="16" fill="#6965DB" opacity="0.14"/>
      <g font-size="9" fill="#8B8B9E">
        <text x="10" y="36">P</text><text x="56" y="36">X</text><text x="103" y="36">Y</text>
        <text x="10" y="55">A</text><text x="56" y="55">120</text><text x="103" y="55">45</text>
        <text x="10" y="77">B</text><text x="56" y="77">380</text><text x="103" y="77">90</text>
      </g>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="680" y="166">pega desde Excel y se reconoce sola</text>
    </g>

    <!-- PDF -->
    <g transform="translate(52,216)">
      <rect x="14" y="0" width="120" height="82" rx="4" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.6"/>
      <rect x="8" y="6" width="120" height="82" rx="4" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.6"/>
      <rect x="0" y="12" width="120" height="82" rx="4" fill="#ffffff" stroke="#6965DB" stroke-width="1.8"/>
      <g fill="#8B8B9E" opacity="0.4"><rect x="14" y="28" width="90" height="5" rx="2"/>
        <rect x="14" y="42" width="72" height="5" rx="2"/><rect x="14" y="56" width="90" height="5" rx="2"/></g>
      <path d="M18 82 q22 -22 44 -6" fill="none" stroke="#E03131" stroke-width="2.2"/>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="120" y="330">anótala y vuelve al original</text>
    </g>

    <!-- grupos -->
    <g transform="translate(330,216)">
      <rect x="0" y="10" width="66" height="50" rx="6" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.4"/>
      <rect x="10" y="22" width="66" height="50" rx="6" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.4"/>
      <rect x="20" y="34" width="66" height="50" rx="6" fill="#ffffff" stroke="#6965DB" stroke-width="1.8"/>
      <path d="M96 50 h22" stroke="#8B8B9E" stroke-width="1.4" marker-end="url(#pn)"/>
      <g>
        <rect x="124" y="8" width="46" height="34" rx="5" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
        <rect x="124" y="52" width="46" height="34" rx="5" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
        <rect x="178" y="8" width="46" height="34" rx="5" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
        <rect x="178" y="52" width="46" height="34" rx="5" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
      </g>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="400" y="330">apílalos, despliégalos, guárdalos por tema</text>
    </g>

    <!-- mini apps -->
    <g transform="translate(608,216)">
      <rect x="0" y="0" width="66" height="42" rx="6" fill="none" stroke="#6965DB" stroke-width="1.6"/>
      <g font-size="14" fill="#6965DB" text-anchor="middle"><text x="33" y="27">7+3</text></g>
      <rect x="78" y="0" width="66" height="42" rx="6" fill="none" stroke="#6965DB" stroke-width="1.6"/>
      <g font-size="12" fill="#6965DB" text-anchor="middle"><text x="111" y="26">08:30</text></g>
      <rect x="0" y="54" width="66" height="42" rx="6" fill="none" stroke="#6965DB" stroke-width="1.6"/>
      <g fill="#6965DB" opacity="0.6"><rect x="10" y="66" width="46" height="4" rx="2"/>
        <rect x="10" y="76" width="34" height="4" rx="2"/><rect x="10" y="86" width="40" height="4" rx="2"/></g>
      <rect x="78" y="54" width="66" height="42" rx="6" fill="none" stroke="#6965DB" stroke-width="1.6"/>
      <g stroke="#6965DB" stroke-width="1.6" fill="none"><path d="M92 84 l14 -18 l12 12 l14 -20"/></g>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="680" y="330">cuentas, cronómetro, lista, contador</text>
    </g>
  </g>
  <defs>
    <marker id="pn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8B8B9E"/>
    </marker>
  </defs>
</svg>
