<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="La actualizacion incremental: los bytes originales no se tocan y las anotaciones se anaden al final">
  <g font-family="sans-serif" font-size="12" fill="#8B8B9E">

    <text x="390" y="22" text-anchor="middle" font-size="14" fill="#6965DB" font-weight="bold">
      cómo se le pega una firma a un PDF sin romperlo
    </text>

    <!-- el archivo -->
    <g transform="translate(120,45)">
      <!-- original -->
      <rect x="0" y="0" width="220" height="230" rx="6" fill="#8B8B9E" fill-opacity="0.12"
            stroke="#8B8B9E" stroke-width="1.5"/>
      <text x="110" y="26" text-anchor="middle" font-size="13" fill="#8B8B9E" font-weight="bold">PDF original</text>
      <text x="110" y="46" text-anchor="middle" font-size="11">ni un byte se toca</text>

      <rect x="20" y="62" width="180" height="34" rx="4" fill="none" stroke="#8B8B9E" stroke-width="1"/>
      <text x="110" y="84" text-anchor="middle" font-size="11">texto, imágenes, fuentes</text>

      <rect x="20" y="106" width="180" height="34" rx="4" fill="none" stroke="#8B8B9E" stroke-width="1"/>
      <text x="110" y="128" text-anchor="middle" font-size="11">página 3</text>

      <rect x="20" y="150" width="180" height="34" rx="4" fill="none" stroke="#8B8B9E" stroke-width="1"/>
      <text x="110" y="172" text-anchor="middle" font-size="11">índice</text>

      <text x="110" y="212" text-anchor="middle" font-size="11" fill="#2F9E44">
        sigue siendo texto: se busca y se selecciona
      </text>
    </g>

    <!-- el apendice -->
    <g transform="translate(440,45)">
      <rect x="0" y="0" width="220" height="230" rx="6" fill="#6965DB" fill-opacity="0.12"
            stroke="#6965DB" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="110" y="26" text-anchor="middle" font-size="13" fill="#6965DB" font-weight="bold">apéndice</text>
      <text x="110" y="46" text-anchor="middle" font-size="11">se añade al final</text>

      <rect x="20" y="62" width="180" height="34" rx="4" fill="none" stroke="#6965DB" stroke-width="1"/>
      <text x="110" y="84" text-anchor="middle" font-size="11">tu firma, en vectores</text>

      <rect x="20" y="106" width="180" height="34" rx="4" fill="none" stroke="#6965DB" stroke-width="1"/>
      <text x="110" y="128" text-anchor="middle" font-size="11">página 3 + esa capa</text>

      <rect x="20" y="150" width="180" height="34" rx="4" fill="none" stroke="#6965DB" stroke-width="1"/>
      <text x="110" y="172" text-anchor="middle" font-size="11">índice nuevo</text>

      <text x="110" y="212" text-anchor="middle" font-size="11" fill="#6965DB">
        m · l · c — los mismos que dibuja el motor
      </text>
    </g>

    <!-- la flecha /Prev -->
    <path d="M455 212 C 400 250, 280 250, 225 212" stroke="#E03131" stroke-width="1.8"
          fill="none" marker-end="url(#f4)"/>
    <text x="340" y="262" text-anchor="middle" font-size="12" fill="#E03131">/Prev — «lo de antes sigue valiendo»</text>

    <text x="390" y="305" text-anchor="middle" font-size="12">
      es el mismo mecanismo con el que se firman digitalmente los PDF · sin librerías
    </text>
  </g>
  <defs>
    <marker id="f4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#E03131"/>
    </marker>
  </defs>
</svg>
