<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-label="Salidas: imagen, SVG para documentos, PDF de varias hojas y archivo editable">
  <g font-family="sans-serif" fill="#8B8B9E">
    <text x="410" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#6965DB">
      por dónde sale el dibujo
    </text>

    <!-- lienzo origen -->
    <g transform="translate(24,66)">
      <rect x="0" y="0" width="150" height="150" rx="6" fill="none" stroke="#8B8B9E" stroke-width="1.6"/>
      <rect x="18" y="18" width="52" height="36" fill="none" stroke="#6965DB" stroke-width="1.8"/>
      <circle cx="108" cy="46" r="22" fill="none" stroke="#6965DB" stroke-width="1.8"/>
      <path d="M18 100 h114" stroke="#6965DB" stroke-width="1.8"/>
      <path d="M18 124 q34 -26 60 -4" fill="none" stroke="#6965DB" stroke-width="1.8"/>
      <text x="75" y="174" text-anchor="middle" font-size="12" fill="#6965DB" font-weight="bold">lienzo</text>
    </g>
    <path d="M188 142 h30" stroke="#8B8B9E" stroke-width="1.6" marker-end="url(#sa)"/>

    <!-- PNG -->
    <g transform="translate(240,44)">
      <rect x="0" y="0" width="118" height="72" rx="4" fill="none" stroke="#2F9E44" stroke-width="1.8"/>
      <path d="M0 62 l32 -26 l24 18 l20 -14 l42 30z" fill="#2F9E44" opacity="0.25"/>
      <text x="59" y="92" text-anchor="middle" font-size="12" fill="#2F9E44" font-weight="bold">PNG · JPG</text>
      <text x="59" y="108" text-anchor="middle" font-size="10.5">a 1×, 2× o 3× · con fondo o sin él</text>
    </g>

    <!-- SVG -->
    <g transform="translate(240,208)">
      <rect x="0" y="0" width="118" height="72" rx="4" fill="none" stroke="#6965DB" stroke-width="1.8"/>
      <path d="M14 54 q22 -44 44 -14 q18 24 46 -22" fill="none" stroke="#6965DB" stroke-width="2.2"/>
      <g fill="#6965DB">
        <rect x="10" y="50" width="7" height="7"/><rect x="54" y="36" width="7" height="7"/>
        <rect x="100" y="14" width="7" height="7"/>
      </g>
      <text x="59" y="92" text-anchor="middle" font-size="12" fill="#6965DB" font-weight="bold">SVG</text>
      <text x="59" y="108" text-anchor="middle" font-size="10.5">para pegarlo dentro de un documento</text>
      <text x="59" y="124" text-anchor="middle" font-size="10.5" fill="#E03131">las letras van en curvas</text>
    </g>

    <!-- PDF -->
    <g transform="translate(432,44)">
      <rect x="24" y="0" width="82" height="106" rx="3" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.4"/>
      <rect x="12" y="8" width="82" height="106" rx="3" fill="#ffffff" stroke="#8B8B9E" stroke-width="1.4"/>
      <rect x="0" y="16" width="82" height="106" rx="3" fill="#ffffff" stroke="#E03131" stroke-width="1.8"/>
      <rect x="14" y="34" width="38" height="24" fill="none" stroke="#6965DB" stroke-width="1.4"/>
      <circle cx="56" cy="86" r="15" fill="none" stroke="#6965DB" stroke-width="1.4"/>
      <text x="53" y="142" text-anchor="middle" font-size="12" fill="#E03131" font-weight="bold">PDF</text>
      <text x="53" y="158" text-anchor="middle" font-size="10.5">una hoja del lienzo = una página</text>
      <text x="53" y="174" text-anchor="middle" font-size="10.5" fill="#2F9E44">sobre un PDF ajeno: su texto sigue vivo</text>
    </g>

    <!-- excalidraw -->
    <g transform="translate(432,240)">
      <rect x="0" y="0" width="110" height="62" rx="4" fill="none" stroke="#6965DB" stroke-width="1.8"/>
      <g font-size="8.5" fill="#6965DB" opacity="0.85">
        <text x="9" y="17">{ "type":</text><text x="9" y="30">  "excalidraw",</text>
        <text x="9" y="43">  "elements": [ … ]</text><text x="9" y="56">}</text>
      </g>
      <text x="55" y="80" text-anchor="middle" font-size="12" fill="#6965DB" font-weight="bold">.excalidraw</text>
      <text x="55" y="96" text-anchor="middle" font-size="10.5">se vuelve a abrir y se sigue editando</text>
    </g>

    <!-- portapapeles -->
    <g transform="translate(690,90)">
      <rect x="0" y="0" width="94" height="106" rx="8" fill="none" stroke="#1971C2" stroke-width="1.8"/>
      <rect x="28" y="-8" width="38" height="17" rx="5" fill="#1971C2" opacity="0.3"/>
      <g fill="#1971C2" opacity="0.4"><rect x="15" y="28" width="64" height="6" rx="3"/>
        <rect x="15" y="44" width="46" height="6" rx="3"/><rect x="15" y="60" width="64" height="6" rx="3"/></g>
      <g stroke="#1971C2" stroke-width="1.6" fill="none">
        <circle cx="32" cy="88" r="6"/><circle cx="66" cy="76" r="6"/><circle cx="66" cy="100" r="6"/>
        <path d="M38 85 l22 -7 M38 91 l22 7"/>
      </g>
      <text x="47" y="132" text-anchor="middle" font-size="12" fill="#1971C2" font-weight="bold">portapapeles</text>
      <text x="47" y="148" text-anchor="middle" font-size="10.5">y compartir a cualquier app</text>
    </g>

    <text x="410" y="368" text-anchor="middle" font-size="11">
      las cuatro salidas encuadran igual · nada sube a ningún sitio: todo se hace en el teléfono
    </text>
  </g>
  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8B8B9E"/>
    </marker>
  </defs>
</svg>
