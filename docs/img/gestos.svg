<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Gestos: un dedo dibuja, dos encuadran, el segundo dedo hace la figura perfecta, un toque quieto activa las herramientas de un toque">
  <g font-family="sans-serif" fill="#8B8B9E">
    <g font-size="13" font-weight="bold" fill="#6965DB" text-anchor="middle">
      <text x="130" y="24">un dedo</text>
      <text x="400" y="24">dos dedos</text>
      <text x="670" y="24">el segundo dedo</text>
      <text x="130" y="218">toque quieto</text>
      <text x="400" y="218">quien empezó, dibuja</text>
      <text x="670" y="218">dos toques con dos dedos</text>
    </g>

    <!-- un dedo dibuja -->
    <rect x="40" y="38" width="180" height="120" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
    <path d="M66 130 q34 -70 62 -30 q26 38 62 -30" fill="none" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="190" cy="70" r="9" fill="#6965DB" opacity="0.35"/>
    <circle cx="190" cy="70" r="4" fill="#6965DB"/>
    <g font-size="11" text-anchor="middle"><text x="130" y="180">dibuja</text></g>

    <!-- dos dedos encuadran -->
    <rect x="310" y="38" width="180" height="120" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
    <rect x="352" y="62" width="70" height="46" rx="3" fill="none" stroke="#8B8B9E" stroke-width="1.6" opacity="0.45"/>
    <rect x="368" y="74" width="96" height="62" rx="3" fill="none" stroke="#6965DB" stroke-width="2"/>
    <g fill="#6965DB">
      <circle cx="348" cy="70" r="8" opacity="0.35"/><circle cx="348" cy="70" r="3.5"/>
      <circle cx="452" cy="128" r="8" opacity="0.35"/><circle cx="452" cy="128" r="3.5"/>
    </g>
    <path d="M360 82 l-14 -10 M440 118 l14 10" stroke="#8B8B9E" stroke-width="1.2"/>
    <g font-size="11" text-anchor="middle"><text x="400" y="180">mueven y acercan · nunca dibujan</text></g>

    <!-- segundo dedo = figura perfecta -->
    <rect x="580" y="38" width="180" height="120" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
    <ellipse cx="632" cy="98" rx="28" ry="20" fill="none" stroke="#8B8B9E" stroke-width="1.8" opacity="0.4"/>
    <circle cx="714" cy="98" r="26" fill="none" stroke="#2F9E44" stroke-width="2.4"/>
    <path d="M664 98 h20" stroke="#8B8B9E" stroke-width="1.4" marker-end="url(#ge)"/>
    <g fill="#2F9E44"><circle cx="600" cy="132" r="10" opacity="0.3"/><circle cx="600" cy="132" r="4"/></g>
    <g font-size="9" fill="#2F9E44"><text x="590" y="152">2.º</text></g>
    <g font-size="11" text-anchor="middle">
      <text x="670" y="180">apóyalo y se vuelve exacta</text>
      <text x="670" y="196">círculo, cuadrado, 45°</text>
    </g>

    <!-- toque quieto -->
    <rect x="40" y="232" width="180" height="110" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
    <circle cx="130" cy="286" r="18" fill="none" stroke="#6965DB" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="130" cy="286" r="5" fill="#6965DB"/>
    <path d="M114 286 h-16 M146 286 h16" stroke="#E03131" stroke-width="1.6"/>
    <g font-size="10" fill="#E03131" text-anchor="middle"><text x="130" y="320">menos de 14 px</text></g>
    <g font-size="11" text-anchor="middle">
      <text x="130" y="360">bote, texto y números esperan a que sueltes</text>
    </g>

    <!-- quien empezo dibuja -->
    <rect x="310" y="232" width="180" height="110" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
    <path d="M336 320 q40 -66 72 -22" fill="none" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <g fill="#6965DB"><circle cx="408" cy="298" r="8" opacity="0.35"/><circle cx="408" cy="298" r="3.5"/></g>
    <g fill="#E03131"><circle cx="452" cy="258" r="8" opacity="0.25"/><circle cx="452" cy="258" r="3.5"/></g>
    <path d="M444 250 l16 16 M460 250 l-16 16" stroke="#E03131" stroke-width="1.8"/>
    <g font-size="11" text-anchor="middle">
      <text x="400" y="360">el otro dedo no deja rastro</text>
    </g>

    <!-- doble toque dos dedos -->
    <rect x="580" y="232" width="180" height="110" rx="8" fill="none" stroke="#8B8B9E" stroke-width="1.2"/>
    <g fill="#6965DB">
      <circle cx="640" cy="278" r="9" opacity="0.3"/><circle cx="640" cy="278" r="4"/>
      <circle cx="700" cy="278" r="9" opacity="0.3"/><circle cx="700" cy="278" r="4"/>
      <circle cx="640" cy="278" r="15" fill="none" stroke="#6965DB" stroke-width="1" opacity="0.5"/>
      <circle cx="700" cy="278" r="15" fill="none" stroke="#6965DB" stroke-width="1" opacity="0.5"/>
    </g>
    <path d="M624 312 h92" stroke="#8B8B9E" stroke-width="1.2" stroke-dasharray="4 3"/>
    <g font-size="10" text-anchor="middle" fill="#8B8B9E"><text x="670" y="328">x2</text></g>
    <g font-size="11" text-anchor="middle"><text x="670" y="360">deshacer</text></g>
  </g>
  <defs>
    <marker id="ge" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8B8B9E"/>
    </marker>
  </defs>
</svg>
