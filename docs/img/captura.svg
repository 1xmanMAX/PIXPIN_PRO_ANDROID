<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-label="Formas de capturar: bola flotante, region libre, ventana detectada, captura larga con desplazamiento">
  <g font-family="sans-serif" fill="#8B8B9E">
    <g font-size="13" font-weight="bold" fill="#6965DB" text-anchor="middle">
      <text x="120" y="24">bola flotante</text>
      <text x="400" y="24">región libre</text>
      <text x="680" y="24">ventana</text>
      <text x="400" y="200">captura larga</text>
    </g>

    <!-- bola flotante -->
    <rect x="60" y="38" width="120" height="120" rx="12" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
    <circle cx="168" cy="98" r="16" fill="#6965DB" opacity="0.85"/>
    <circle cx="168" cy="98" r="30" fill="none" stroke="#6965DB" stroke-width="1" opacity="0.4"/>
    <g fill="#6965DB" opacity="0.35">
      <circle cx="128" cy="62" r="11"/><circle cx="114" cy="98" r="11"/><circle cx="128" cy="134" r="11"/>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="120" y="178">siempre a mano</text>
      <text x="120" y="194">también desde ajustes rápidos</text>
    </g>

    <!-- region libre -->
    <rect x="330" y="38" width="140" height="120" rx="6" fill="#8B8B9E" opacity="0.1"/>
    <rect x="330" y="38" width="140" height="120" rx="6" fill="none" stroke="#8B8B9E" stroke-width="1"/>
    <rect x="352" y="60" width="94" height="66" fill="none" stroke="#6965DB" stroke-width="2"/>
    <g fill="#6965DB">
      <rect x="347" y="55" width="10" height="10"/><rect x="441" y="55" width="10" height="10"/>
      <rect x="347" y="121" width="10" height="10"/><rect x="441" y="121" width="10" height="10"/>
    </g>
    <g font-size="10" fill="#6965DB"><text x="352" y="52">94 × 66</text></g>
    <g font-size="11" text-anchor="middle"><text x="400" y="178">arrastra y ajusta esquina a esquina</text></g>

    <!-- ventana -->
    <rect x="610" y="38" width="140" height="120" rx="6" fill="none" stroke="#8B8B9E" stroke-width="1"/>
    <rect x="622" y="50" width="116" height="40" rx="3" fill="#6965DB" opacity="0.1" stroke="#6965DB" stroke-width="1.6"/>
    <rect x="622" y="98" width="55" height="48" rx="3" fill="none" stroke="#8B8B9E" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="685" y="98" width="53" height="48" rx="3" fill="none" stroke="#8B8B9E" stroke-width="1" stroke-dasharray="3 3"/>
    <g font-size="11" text-anchor="middle"><text x="680" y="178">reconoce el bloque bajo el dedo</text></g>

    <!-- captura larga -->
    <g font-size="11" fill="#2F9E44" text-anchor="middle"><text x="400" y="220">busca el trozo repetido</text></g>
    <g transform="translate(210,246)">
      <rect x="0" y="0" width="100" height="86" rx="4" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <g fill="#8B8B9E" opacity="0.25"><rect x="12" y="14" width="76" height="8"/><rect x="12" y="30" width="60" height="8"/>
        <rect x="12" y="46" width="76" height="8"/><rect x="12" y="62" width="44" height="8"/></g>
      <rect x="130" y="0" width="100" height="86" rx="4" fill="none" stroke="#8B8B9E" stroke-width="1.4"/>
      <g fill="#8B8B9E" opacity="0.25"><rect x="142" y="8" width="76" height="8"/><rect x="142" y="24" width="44" height="8"/>
        <rect x="142" y="40" width="76" height="8"/><rect x="142" y="56" width="66" height="8"/></g>
      <rect x="12" y="46" width="76" height="24" fill="#2F9E44" opacity="0.22"/>
      <rect x="142" y="0" width="76" height="24" fill="#2F9E44" opacity="0.22"/>
      <path d="M104 44 h22" stroke="#6965DB" stroke-width="1.6" marker-end="url(#ca)"/>
      <rect x="272" y="-14" width="100" height="118" rx="4" fill="none" stroke="#6965DB" stroke-width="2"/>
      <g fill="#6965DB" opacity="0.3"><rect x="284" y="0" width="76" height="8"/><rect x="284" y="16" width="60" height="8"/>
        <rect x="284" y="32" width="76" height="8"/><rect x="284" y="48" width="44" height="8"/>
        <rect x="284" y="64" width="76" height="8"/><rect x="284" y="80" width="66" height="8"/></g>
      <path d="M236 44 h30" stroke="#6965DB" stroke-width="1.6" marker-end="url(#ca)"/>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="400" y="362">desplaza sola, encaja los trozos y cose una imagen entera</text>
    </g>
  </g>
  <defs>
    <marker id="ca" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6965DB"/>
    </marker>
  </defs>
</svg>
