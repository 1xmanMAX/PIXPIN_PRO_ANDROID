<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Herramientas de construir: bote de relleno, recortar, extender, alfiler, guias y transportador">
  <g font-family="sans-serif" fill="#8B8B9E">
    <g font-size="13" font-weight="bold" fill="#6965DB" text-anchor="middle">
      <text x="140" y="24">bote</text>
      <text x="400" y="24">recortar</text>
      <text x="660" y="24">extender</text>
      <text x="140" y="194">alfiler</text>
      <text x="400" y="194">guías</text>
      <text x="660" y="194">transportador</text>
    </g>

    <!-- bote: dos figuras que se cruzan, la lente rellena -->
    <defs>
      <pattern id="rayas" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#6965DB" stroke-width="1.6"/>
      </pattern>
    </defs>
    <path d="M140 61.8 A44 44 0 0 1 140 122.2 A44 44 0 0 1 140 61.8z" fill="url(#rayas)"/>
    <circle cx="108" cy="92" r="44" fill="none" stroke="#6965DB" stroke-width="2"/>
    <circle cx="172" cy="92" r="44" fill="none" stroke="#6965DB" stroke-width="2"/>
    <circle cx="140" cy="92" r="4" fill="#E03131"/>
    <g font-size="11" text-anchor="middle"><text x="140" y="158">toca dentro · si está cerrado, se llena</text></g>

    <!-- recortar -->
    <g stroke="#8B8B9E" stroke-width="1.6" stroke-dasharray="4 4">
      <path d="M340 50 v90"/>
      <path d="M460 50 v90"/>
    </g>
    <path d="M300 95 h40" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M460 95 h40" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M340 95 h120" stroke="#E03131" stroke-width="2.6" stroke-dasharray="5 5" opacity="0.55"/>
    <circle cx="400" cy="95" r="4" fill="#E03131"/>
    <g font-size="11" text-anchor="middle"><text x="400" y="158">borra solo el tramo entre los cruces</text></g>

    <!-- extender -->
    <path d="M580 130 L660 74" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M660 74 L724 30" stroke="#2F9E44" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 4"/>
    <path d="M700 20 v110" stroke="#8B8B9E" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle cx="700" cy="48" r="4" fill="#2F9E44"/>
    <g font-size="11" text-anchor="middle"><text x="660" y="158">la alarga hasta el primero que encuentre</text></g>

    <!-- alfiler -->
    <path d="M56 300 L200 244" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M110 314 L176 220" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="141" cy="267" r="6" fill="#E03131"/>
    <path d="M176 220 A 60 60 0 0 1 206 250" fill="none" stroke="#E03131" stroke-width="1.4"
          stroke-dasharray="3 3" marker-end="url(#pa)"/>
    <g font-size="11" text-anchor="middle">
      <text x="140" y="330">0 clavos: libre · 1: gira · 2: fija</text>
    </g>

    <!-- guias -->
    <g opacity="0.4" stroke="#6965DB" stroke-width="2">
      <circle cx="400" cy="272" r="46" fill="none"/>
      <path d="M330 272 h140"/>
    </g>
    <path d="M400 272 L442 244" stroke="#6965DB" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="400" cy="272" r="3.5" fill="#E03131"/>
    <path d="M394 266 h12 M400 260 v12" stroke="#8B8B9E" stroke-width="1"/>
    <g font-size="11" text-anchor="middle">
      <text x="400" y="330">translúcidas · imantan · se ocultan de un botón</text>
    </g>

    <!-- transportador -->
    <path d="M600 296 A 60 60 0 0 1 720 296 z" fill="#6965DB" opacity="0.12"/>
    <path d="M600 296 A 60 60 0 0 1 720 296" fill="none" stroke="#6965DB" stroke-width="1.8" opacity="0.6"/>
    <g stroke="#8B8B9E" stroke-width="1" opacity="0.8">
      <path d="M660 296 L613 268 M660 296 L633 248 M660 296 L660 236 M660 296 L687 248 M660 296 L707 268"/>
    </g>
    <path d="M660 296 L707 268" stroke="#E03131" stroke-width="2.4" stroke-linecap="round"/>
    <g font-size="11" text-anchor="middle"><text x="660" y="330">el círculo guía hace de escuadra</text></g>
  </g>
  <defs>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#E03131"/>
    </marker>
  </defs>
</svg>
