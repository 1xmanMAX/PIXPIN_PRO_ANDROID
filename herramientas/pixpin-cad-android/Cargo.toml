[package]
name = "pixpin-cad-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

# El visor de planos del PC (crates/pixpin-cad), sin Direct3D: lee el DWG/DXF y lo deja en el
# formato de su caché (PXCAD v3), que Android dibuja con OpenGL ES. Ver traer-del-pc.sh.
[lib]
name = "pixpincad"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "convertir-plano"
path = "src/bin/convertir.rs"

[dependencies]
# Igual que en el PC: misma revisión, para leer los mismos planos de la misma manera.
opencadcodec = { git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "c9ffcac" }
lyon_tessellation = "1.0"
ttf-parser = "0.25"
tracing = "0.1"
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[workspace]
