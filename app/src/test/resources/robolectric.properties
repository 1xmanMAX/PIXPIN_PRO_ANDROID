# Conscrypt apagado.
#
# Robolectric instala Conscrypt como proveedor de seguridad al montar el entorno
# de Android, y Conscrypt es una biblioteca **nativa**: necesita un `.so`
# compilado para la arquitectura de la máquina. Para Linux sobre ARM64 no se
# publica ninguno, así que en un móvil o en un servidor ARM el arranque falla con
# `UnsatisfiedLinkError: no conscrypt_openjdk_jni-linux-aarch_64` y con él se
# caen **todas** las pruebas de Robolectric, sin haber llegado a ejecutar una
# sola línea del código que querían comprobar.
#
# Robolectric ya prevé esto, pero solo a medias: su valor por defecto es OFF
# cuando detecta macOS sobre ARM, y ON en cualquier otro sitio. Linux sobre ARM
# —que es donde se compila este proyecto— se queda fuera de esa excepción.
#
# Apagarlo no le quita nada a estas pruebas: Conscrypt aporta TLS y criptografía,
# y aquí lo que se comprueba son gestos, ventanas y costura de capturas. Con esto
# se usa el proveedor de la propia JVM, que para lo que hace falta sobra.
conscryptMode=OFF
