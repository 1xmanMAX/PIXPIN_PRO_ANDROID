# **El APK de prueba, compilado en GitHub y publicado como prerelease.**
#
# Desde el entorno de Claude no siempre se puede subir un archivo a una release, así que esto lo
# hace GitHub: compila `assembleRelease`, lo pasa por `herramientas/apk-para-repartir.sh` (la
# firma v1 que pide el instalador de archivos descargados) y lo publica como
# `v<versión>-prueba`, igual que las anteriores. Se lanza solo a mano, desde la pestaña Actions.
#
# La clave: ver el paso «Clave de depuración». Con el secreto CLAVE_DE_DEPURACION firma con esa;
# sin él, con `herramientas/pixpin-prueba.keystore`, que es fija: cada versión de prueba se instala
# encima de la anterior.
name: APK de prueba

# Solo a mano (pestaña Actions → «APK de prueba» → Run workflow): empujar código no compila nada.
on:
  workflow_dispatch:
    inputs:
      rapido:
        description: "Sin R8 (-Prapido): compila antes; el APK pesa más"
        type: boolean
        default: false
      estable:
        description: "Release estable (v<versión>, sin «prueba» ni prerelease)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-de-prueba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Toda la historia: las notas salen del último cambio de versión, no del último commit.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: SDK de Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # **La clave con la que se firma.** Para que el APK se instale encima del que ya hay en el
      # teléfono tiene que ser la misma de siempre: la `debug.keystore` del ordenador donde se
      # compilaban las anteriores (SHA-256 05554faf…). Se guarda en el secreto
      # CLAVE_DE_DEPURACION, en base64. Sin el secreto se usa la clave de prueba del repositorio
      # (SHA-256 72a69d9e…), fija, para que las versiones de prueba se actualicen entre sí.
      - name: Clave de depuración
        env:
          CLAVE: ${{ secrets.CLAVE_DE_DEPURACION }}
        run: |
          mkdir -p ~/.android
          if [ -n "$CLAVE" ]; then
            echo "$CLAVE" | base64 -d > ~/.android/debug.keystore
            echo "Firmando con la clave de siempre."
          else
            # **La clave de prueba del repositorio** (24-sep-2026): sin secreto se creaba una clave
            # nueva en cada compilación y ninguna versión se instalaba encima de la anterior. Esta
            # es siempre la misma, así que las de prueba se actualizan unas a otras.
            cp herramientas/pixpin-prueba.keystore ~/.android/debug.keystore
            echo "Firmando con la clave de prueba del repositorio (herramientas/pixpin-prueba.keystore)."
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 SHA256

      - name: Compilar
        run: ./gradlew :app:assembleRelease --stacktrace ${{ inputs.rapido && '-Prapido' || '' }}

      - name: Firmar para repartir
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # El proyecto deja lo compilado en `pixpin-build`, fuera de app/build.
          sh herramientas/apk-para-repartir.sh "PixPin-$VERSION.apk"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Estable: `v<versión>` y release normal. Si no, la prerelease de prueba de siempre.
          if [ "${{ inputs.estable }}" = "true" ]; then
            TAG="v$VERSION"; TITULO="v$VERSION"; TIPO=""
          else
            TAG="v$VERSION-prueba"; TITULO="v$VERSION (prueba)"; TIPO="--prerelease"
          fi
          NOTAS=$(git log -1 --format=%B -- app/build.gradle.kts | sed '/^Co-Authored-By:/d;/^Claude-Session:/d')
          # Si ya estaba (se volvió a empujar con la misma versión), se reemplaza el APK.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "PixPin-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "PixPin-$VERSION.apk" $TIPO \
              --target "$GITHUB_SHA" --title "$TITULO" --notes "$NOTAS"
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
